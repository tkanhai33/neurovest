name: Architecture CI Guard

on:
  push:
  pull_request:

jobs:
  architecture-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Architecture Guard
        run: |
          python3 scripts/ci/architecture_ci_guard_v1.py
