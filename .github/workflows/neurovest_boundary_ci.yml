name: NeuroVest Boundary CI

on:
  push:
  pull_request:

jobs:
  boundary-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Boundary Guard
        run: |
          bash backend/app/spine/_enforcement/guards/run_ci_guard.sh
